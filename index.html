<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keuangan Masjid Nurussalam</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --hijau:#0f5132; --hijau-muda:#e8f3ec; --emas:#b8860b; }
  body { background:#f7faf8; color:#1d2b24; font-size:1.05rem; }
  header { background:var(--hijau); color:#fff; padding:1.6rem 1rem; text-align:center; border-bottom:5px solid var(--emas); }
  header h1 { font-size:1.6rem; margin:0; font-weight:700; }
  header p { margin:.3rem 0 0; opacity:.9; }
  .kotak { background:#fff; border:1px solid #cfe3d6; border-radius:12px; padding:1rem; height:100%; }
  .kotak small { color:#5b6b62; display:block; }
  .kotak strong { font-size:1.3rem; }
  .kotak.utama { background:var(--hijau); color:#fff; border-color:var(--hijau); }
  .kotak.utama small { color:#d6eadf; }
  .masuk { color:#198754; font-weight:600; } .keluar { color:#c0392b; font-weight:600; }
  th { background:var(--hijau-muda); white-space:nowrap; }
  td, th { vertical-align:middle; }
</style>
</head>
<body>
<header>
  <h1>Keuangan Masjid Nurussalam</h1>
  <p>Laporan terbuka untuk seluruh jamaah</p>
</header>

<main class="container py-4" style="max-width:900px">
  <h2 class="h5 mb-3">Ringkasan <span id="bulan"></span></h2>
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3"><div class="kotak"><small>Saldo awal bulan</small><strong id="awal">-</strong></div></div>
    <div class="col-6 col-md-3"><div class="kotak"><small>Pemasukan</small><strong id="masuk" class="masuk">-</strong></div></div>
    <div class="col-6 col-md-3"><div class="kotak"><small>Pengeluaran</small><strong id="keluar" class="keluar">-</strong></div></div>
    <div class="col-6 col-md-3"><div class="kotak utama"><small>Saldo akhir</small><strong id="akhir">-</strong></div></div>
  </div>

  <h2 class="h5 mb-3">Transaksi terbaru</h2>
  <div id="pesan" class="alert alert-secondary">Memuat data...</div>
  <div class="table-responsive bg-white border rounded">
    <table class="table table-hover mb-0">
      <thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th class="text-end">Nominal</th></tr></thead>
      <tbody id="isi"></tbody>
    </table>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyExgGIoxvQPJ8XxYIeAYKvZSxoHIqJA0HWrcR_qaiwXauZ7sPjonMcex1W8QV2UMmozA/exec';
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function tglIndo(t) { const [y,m,d] = t.split('-'); return d + ' ' + BULAN[m-1].slice(0,3) + ' ' + y; }

async function muat() {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    tampil(json.data);
    $('pesan').remove();
  } catch (e) {
    $('pesan').className = 'alert alert-danger';
    $('pesan').textContent = 'Data gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.';
  }
}

function tampil(data) {
  const now = new Date();
  const ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  $('bulan').textContent = BULAN[now.getMonth()] + ' ' + now.getFullYear();

  let awal = 0, masuk = 0, keluar = 0;
  data.forEach(t => {
    const nilai = t.tipe === 'Masuk' ? t.nominal : -t.nominal;
    if (t.tanggal.slice(0,7) < ym) awal += nilai;                 // sebelum bulan ini
    else if (t.tanggal.slice(0,7) === ym) t.tipe === 'Masuk' ? masuk += t.nominal : keluar += t.nominal;
  });
  $('awal').textContent = rp(awal);
  $('masuk').textContent = rp(masuk);
  $('keluar').textContent = rp(keluar);
  $('akhir').textContent = rp(awal + masuk - keluar);

  const terbaru = data.slice().sort((a,b) => b.tanggal.localeCompare(a.tanggal)).slice(0, 30);
  $('isi').innerHTML = terbaru.length ? terbaru.map(t => `
    <tr>
      <td class="text-nowrap">${tglIndo(t.tanggal)}</td>
      <td class="${t.tipe === 'Masuk' ? 'masuk' : 'keluar'}">${t.tipe === 'Masuk' ? 'Pemasukan' : 'Pengeluaran'}</td>
      <td>${esc(t.kategori)}</td>
      <td>${esc(t.keterangan)}</td>
      <td class="text-end text-nowrap ${t.tipe === 'Masuk' ? 'masuk' : 'keluar'}">${rp(t.nominal)}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="text-center text-muted">Belum ada transaksi.</td></tr>';
}
muat();
</script>
</body>
</html>
